<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .counter-section {
            margin: 30px 0;
        }

        .counter-display {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            transition: transform 0.2s ease;
        }

        .counter-display.pop {
            transform: scale(1.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .color-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            margin: 20px auto;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .todo-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .todo-input:focus {
            border-color: #667eea;
        }

        .todo-list {
            list-style: none;
            margin-top: 15px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.done span {
            text-decoration: line-through;
            color: #999;
        }

        .todo-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .todo-item span {
            flex: 1;
        }

        .todo-item .delete-btn {
            background: none;
            border: none;
            color: #f5576c;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 5px;
        }

        .clock {
            font-size: 1.5em;
            color: #667eea;
            margin: 20px 0;
            font-weight: 600;
        }

        footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interactive Test Page</h1>
        <p class="subtitle">A demo page with interactive features</p>

        <div class="clock" id="clock"></div>

        <div class="counter-section">
            <h2>Counter</h2>
            <div class="counter-display" id="counter">0</div>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="changeCounter(-1)">- 1</button>
                <button class="btn btn-reset" onclick="resetCounter()">Reset</button>
                <button class="btn btn-primary" onclick="changeCounter(1)">+ 1</button>
            </div>
        </div>

        <div class="color-section">
            <h2>Click the box to change color</h2>
            <div class="color-box" id="colorBox" onclick="changeColor()"></div>
        </div>

        <div class="todo-section">
            <h2>Todo List <small style="font-size:0.5em;color:#888;">（Supabase 云端共享）</small></h2>
            <div class="todo-input-group">
                <input type="text" class="todo-input" id="todoInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="addTodo()">Add</button>
            </div>
            <p id="todoStatus" style="color:#999;font-size:0.9em;margin-top:10px;">Loading...</p>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <footer>
        <p>Deployed on GitHub Pages</p>
    </footer>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

        // ===== Supabase 配置（替换成你自己的）=====
        const SUPABASE_URL = 'https://zrjsrqzluctpdnjcobuy.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_wcwwyYWV3J7aXa6rXYwVUQ_s6p0s-Fi';
        // =========================================

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---------- Counter & Color & Clock ----------
        let count = 0;
        const counterEl = document.getElementById('counter');
        const colorBox = document.getElementById('colorBox');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const todoStatus = document.getElementById('todoStatus');

        window.changeCounter = (delta) => {
            count += delta;
            counterEl.textContent = count;
            counterEl.classList.add('pop');
            setTimeout(() => counterEl.classList.remove('pop'), 200);
        };
        window.resetCounter = () => { count = 0; counterEl.textContent = '0'; };

        const randomColor = () => '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        window.changeColor = () => {
            colorBox.style.background = `linear-gradient(135deg, ${randomColor()}, ${randomColor()})`;
            colorBox.style.transform = `rotate(${Math.random() * 360}deg) scale(${0.8 + Math.random() * 0.4})`;
        };
        window.changeColor();

        const updateClock = () => {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('zh-CN', { hour12: false });
        };
        updateClock();
        setInterval(updateClock, 1000);

        // ---------- Todo CRUD with Supabase ----------
        const setStatus = (msg, isError) => {
            todoStatus.textContent = msg;
            todoStatus.style.color = isError ? '#f5576c' : '#999';
        };

        const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));

        // R - 读取
        async function loadTodos() {
            setStatus('加载中...');
            const { data, error } = await supabase
                .from('todos')
                .select('*')
                .order('created_at', { ascending: true });
            if (error) { setStatus('加载失败：' + error.message, true); return; }
            renderTodos(data || []);
            setStatus(`共 ${data?.length || 0} 条`);
        }

        function renderTodos(items) {
            todoList.innerHTML = '';
            items.forEach(item => {
                const li = document.createElement('li');
                li.className = 'todo-item' + (item.done ? ' done' : '');
                li.dataset.id = item.id;
                li.innerHTML = `
                    <input type="checkbox" ${item.done ? 'checked' : ''}>
                    <span>${escapeHtml(item.text)}</span>
                    <button class="delete-btn">&times;</button>
                `;
                li.querySelector('input').addEventListener('change', (e) => toggleTodo(item.id, e.target.checked));
                li.querySelector('.delete-btn').addEventListener('click', () => deleteTodo(item.id));
                todoList.appendChild(li);
            });
        }

        // C - 新增
        window.addTodo = async () => {
            const text = todoInput.value.trim();
            if (!text) return;
            todoInput.value = '';
            setStatus('添加中...');
            const { error } = await supabase.from('todos').insert({ text, done: false });
            if (error) { setStatus('添加失败：' + error.message, true); return; }
            await loadTodos();
        };

        // U - 更新
        async function toggleTodo(id, done) {
            const { error } = await supabase.from('todos').update({ done }).eq('id', id);
            if (error) { setStatus('更新失败：' + error.message, true); return; }
            await loadTodos();
        }

        // D - 删除
        async function deleteTodo(id) {
            const { error } = await supabase.from('todos').delete().eq('id', id);
            if (error) { setStatus('删除失败：' + error.message, true); return; }
            await loadTodos();
        }

        window.handleKeyPress = (e) => { if (e.key === 'Enter') window.addTodo(); };

        // 实时订阅：其他用户改动后本页自动刷新
        supabase.channel('todos-realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => loadTodos())
            .subscribe();

        loadTodos();
    </script>
</body>
</html>
