<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .counter-section {
            margin: 30px 0;
        }

        .counter-display {
            font-size: 4em;
            font-weight: bold;
            color: #667eea;
            transition: transform 0.2s ease;
        }

        .counter-display.pop {
            transform: scale(1.3);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .color-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 15px;
            margin: 20px auto;
            transition: all 0.5s ease;
            cursor: pointer;
        }

        .todo-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
            text-align: left;
        }

        .todo-input-group {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .todo-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }

        .todo-input:focus {
            border-color: #667eea;
        }

        .todo-list {
            list-style: none;
            margin-top: 15px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 8px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .todo-item.done span {
            text-decoration: line-through;
            color: #999;
        }

        .todo-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .todo-item span {
            flex: 1;
        }

        .todo-item .delete-btn {
            background: none;
            border: none;
            color: #f5576c;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 5px;
        }

        .clock {
            font-size: 1.5em;
            color: #667eea;
            margin: 20px 0;
            font-weight: 600;
        }

        footer {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Interactive Test Page</h1>
        <p class="subtitle">A demo page with interactive features</p>

        <div class="clock" id="clock"></div>

        <div class="counter-section">
            <h2>Counter</h2>
            <div class="counter-display" id="counter">0</div>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="changeCounter(-1)">- 1</button>
                <button class="btn btn-reset" onclick="resetCounter()">Reset</button>
                <button class="btn btn-primary" onclick="changeCounter(1)">+ 1</button>
            </div>
        </div>

        <div class="color-section">
            <h2>Click the box to change color</h2>
            <div class="color-box" id="colorBox" onclick="changeColor()"></div>
        </div>

        <div class="todo-section">
            <h2>Todo List</h2>
            <div class="todo-input-group">
                <input type="text" class="todo-input" id="todoInput" placeholder="Add a new task..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="addTodo()">Add</button>
            </div>
            <ul class="todo-list" id="todoList"></ul>
        </div>
    </div>

    <footer>
        <p>Deployed on GitHub Pages</p>
    </footer>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        const colorBox = document.getElementById('colorBox');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');

        function changeCounter(delta) {
            count += delta;
            counterEl.textContent = count;
            counterEl.classList.add('pop');
            setTimeout(() => counterEl.classList.remove('pop'), 200);
        }

        function resetCounter() {
            count = 0;
            counterEl.textContent = '0';
        }

        function randomColor() {
            return '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        }

        function changeColor() {
            colorBox.style.background = `linear-gradient(135deg, ${randomColor()}, ${randomColor()})`;
            colorBox.style.transform = `rotate(${Math.random() * 360}deg) scale(${0.8 + Math.random() * 0.4})`;
        }

        changeColor();

        function addTodo() {
            const text = todoInput.value.trim();
            if (!text) return;

            const li = document.createElement('li');
            li.className = 'todo-item';
            li.innerHTML = `
                <input type="checkbox" onchange="toggleTodo(this)">
                <span>${text}</span>
                <button class="delete-btn" onclick="deleteTodo(this)">&times;</button>
            `;
            todoList.appendChild(li);
            todoInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') addTodo();
        }

        function toggleTodo(checkbox) {
            checkbox.parentElement.classList.toggle('done');
        }

        function deleteTodo(btn) {
            const item = btn.parentElement;
            item.style.opacity = '0';
            item.style.transform = 'translateX(20px)';
            setTimeout(() => item.remove(), 300);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent =
                now.toLocaleTimeString('zh-CN', { hour12: false });
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
